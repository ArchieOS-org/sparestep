# Optional administrator policy for /etc/codex/requirements.toml.
# Merge with an existing administrator policy; do not replace one blindly.
default_permissions = "agent-file-guard"

[allowed_permission_profiles]
agent-file-guard = true

[permissions.filesystem]
deny_read = [
  "~/.Trash", "~/.Trashes",
  "/**/.[Tt][Rr][Aa][Ss][Hh]", "/**/.[Tt][Rr][Aa][Ss][Hh]/**",
  "/**/.[Tt][Rr][Aa][Ss][Hh][Ee][Ss]", "/**/.[Tt][Rr][Aa][Ss][Hh][Ee][Ss]/**",
]

# BEGIN agent-file-guard permissions
[permissions.agent-file-guard]
description = "Local development with macOS Trash inaccessible"

[permissions.agent-file-guard.filesystem]
":root" = "write"
"~/.Trash" = "deny"
"~/.Trashes" = "deny"
"/**/.[Tt][Rr][Aa][Ss][Hh]" = "deny"
"/**/.[Tt][Rr][Aa][Ss][Hh]/**" = "deny"
"/**/.[Tt][Rr][Aa][Ss][Hh][Ee][Ss]" = "deny"
"/**/.[Tt][Rr][Aa][Ss][Hh][Ee][Ss]/**" = "deny"

[permissions.agent-file-guard.network]
enabled = true
# END agent-file-guard permissions
